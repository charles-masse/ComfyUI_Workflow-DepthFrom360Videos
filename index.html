<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>360 Video Player</title>
        <style>
            body {margin: 0;}
            
            #canvas {
                width: 100vw !important;
                height: 100vh !important;
                display: block;
                position: fixed;
                top: 0;
                left: 0;
            }
        </style>
    </head>

    <body>
        <canvas id="canvas"></canvas>
        <script type="module">

            import * as THREE from 'three';
            import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
            import {VRButton} from 'three/addons/webxr/VRButton.js';

            import {Viewer, Style} from 'three-6dof';

            const canvas = document.querySelector('#canvas');

            const renderer = new THREE.WebGLRenderer({
                canvas : canvas,
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(VRButton.createButton(renderer));

            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
            // camera.position.z = 0.1;

            const controls = new OrbitControls(camera, renderer.domElement);
            camera.position.set(0, 5, 25);
            controls.autoRotate = true;

            const loader = new THREE.TextureLoader();

            const colorTexture = loader.load('color.png');
            colorTexture.format = THREE.RGBAFormat;
            const depthTexture = loader.load('depth.png');

            const sixDofViewer = new Viewer(colorTexture, depthTexture, {
                'radius' : 7,
                'density': 1024,
                'style': Style.POINTS,
            });
            scene.add(sixDofViewer);

            renderer.setAnimationLoop(animate);

            function animate(time) {

                controls.update();
                renderer.render(scene, camera);

            }

            window.addEventListener('resize', ev => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        </script>
    </body>

</html>
